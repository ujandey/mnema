name: Research Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full research (10 seeds) or quick pipeline check (1 seed)
        type: choice
        options: [full, quick]
        default: full
  push:
    branches: [research-benchmark-run]

permissions:
  contents: read

concurrency:
  group: research-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: experiments/research_requirements.txt
      - run: python -m pip install -r experiments/research_requirements.txt
      - run: python -m unittest discover -s tests -p 'test_research*.py' -v
      - name: Prepare shared configuration and data order
        id: prepare
        env:
          MODE: ${{ inputs.mode || 'full' }}
        run: python experiments/research_actions.py prepare --mode "$MODE" --directory .benchmark-actions/prepared
      - uses: actions/upload-artifact@v4
        with:
          name: research-inputs
          path: |
            .benchmark-actions/prepared/
            data/*.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  benchmark:
    needs: prepare
    name: Seed ${{ matrix.seed }} / ${{ matrix.method }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: experiments/research_requirements.txt
      - run: python -m pip install -r experiments/research_requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: research-inputs
          path: .
      - name: Run complete method and seed
        env:
          SEED: ${{ matrix.seed }}
          METHOD: ${{ matrix.method }}
        run: >-
          python experiments/research_actions.py run
          --directory .benchmark-actions/prepared
          --output .benchmark-actions/shard
          --seed "$SEED" --method "$METHOD"
      - uses: actions/upload-artifact@v4
        with:
          name: research-shard-${{ matrix.seed }}-${{ matrix.method }}
          path: .benchmark-actions/shard/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  report:
    needs: [prepare, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: experiments/research_requirements.txt
      - run: python -m pip install -r experiments/research_requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: research-inputs
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: research-shard-*
          path: .benchmark-actions/shards
      - name: Validate all results and generate report
        run: >-
          python experiments/research_actions.py collect
          --directory .benchmark-actions/prepared
          --shards .benchmark-actions/shards
      - name: Display results in Actions summary
        run: cat .benchmark-actions/prepared/summaries/summary_table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: research-benchmark-${{ inputs.mode || 'full' }}
          path: .benchmark-actions/prepared/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
