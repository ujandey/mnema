name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.7"
          cache: pip
          cache-dependency-path: experiments/research_requirements.txt
      - name: Install tested dependencies
        run: python -m pip install -r experiments/research_requirements.txt
      - name: Run research tests
        run: python -m unittest discover -s tests -p "test_research*.py" -v
      - name: Verify operation-count calibration
        run: python experiments/e0_calibrate.py
