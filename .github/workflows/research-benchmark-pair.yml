name: Research Benchmark Pair

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Seed index (0-9)
        required: true
        type: string
        default: '0'
      method:
        description: Canonical benchmark method slug
        required: true
        type: choice
        options:
          - naive
          - replay300
          - replay64kib
          - ewc
          - derpp300
          - mnema
        default: naive

permissions:
  contents: read

concurrency:
  group: research-benchmark-pair-${{ github.ref }}-${{ inputs.seed }}-${{ inputs.method }}
  cancel-in-progress: false

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  benchmark:
    name: Seed ${{ inputs.seed }} / ${{ inputs.method }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: experiments/research_requirements.txt
      - name: Cache MNIST archive files
        uses: actions/cache@v4
        with:
          path: data
          key: mnist-gz-md5-v1
      - name: Verify cached MNIST files
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "train-images-idx3-ubyte.gz": "f68b3c2dcbeaaa9fbdd348bbdeb94873",
              "train-labels-idx1-ubyte.gz": "d53e105ee54ea40749a09fcbcd1e9432",
              "t10k-images-idx3-ubyte.gz": "9fb629c4189551a2d022fa330f9573f3",
              "t10k-labels-idx1-ubyte.gz": "ec29112dd5afa0611ce80d1b7f02629c",
          }
          data = Path("data")
          for name, checksum in expected.items():
              path = data / name
              if path.exists() and hashlib.md5(path.read_bytes()).hexdigest() != checksum:
                  path.unlink()
          PY
      - run: python -m pip install -r experiments/research_requirements.txt
      - name: Validate runner CLI
        run: python experiments/run_research_benchmark.py --help
      - name: Run one full-data seed-method pair
        env:
          SEED: ${{ inputs.seed }}
          METHOD: ${{ inputs.method }}
        run: >-
          python experiments/run_research_benchmark.py
          --mode full
          --seed "$SEED"
          --method "$METHOD"
      - uses: actions/upload-artifact@v4
        with:
          name: research-seed-${{ inputs.seed }}-${{ inputs.method }}
          path: results/github-actions/seed_${{ inputs.seed }}/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
