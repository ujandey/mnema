[project]
name = "mnema-arch"
version = "0.1.0"
description = "MNEMA: memory-native, event-driven architecture for continual learning research."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ujan Dey", email = "ujandey007@gmail.com" },
    { name = "Swapnil", email = "swapnil7x@gmail.com" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.2.6",
    "matplotlib==3.10.3",
    "PyYAML==6.0.2",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
