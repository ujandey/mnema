[project]
name = "mnema-arch"
version = "0.1.0"
description = "MNEMA: memory-native, event-driven architecture for bounded continual learning at the edge. Proprietary — COGNX."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Swapnil", email = "swapnil7x@gmail.com" }
]
classifiers = [
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
mnema-arch = "mnema_arch:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
